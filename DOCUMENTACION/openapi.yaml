openapi: 3.0.3
info:
  title: Operations Management System API
  version: 2.0.0
  description: |
    Especificación OpenAPI actualizada según las rutas y controladores vigentes del proyecto.
    Esta versión ya no incluye proveedores, compras, detalles de compra ni lotes.
servers:
  - url: http://localhost:3000
    description: Servidor local por defecto
tags:
  - name: Health
  - name: Clients
  - name: Ingredients
  - name: Categories
  - name: Products
  - name: Recipes
  - name: States
  - name: Orders
  - name: Lines
  - name: Stock Movement Types
  - name: Stock Movements

paths:
  /:
    get:
      tags: [Health]
      summary: Verifica que la API esté funcionando
      responses:
        '200':
          description: Mensaje de disponibilidad
          content:
            text/plain:
              schema:
                type: string
                example: API funcionando

  /api/clients:
    get:
      tags: [Clients]
      summary: Lista clientes con paginación
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Clientes paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Client'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Clients]
      summary: Crea un cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreateInput'
      responses:
        '201':
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/clients/{id}:
    get:
      tags: [Clients]
      summary: Obtiene un cliente por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ingredient:
    get:
      tags: [Ingredients]
      summary: Lista ingredientes con paginación y filtro por nombre
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Ingredientes paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ingredient'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Ingredients]
      summary: Crea un ingrediente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '201':
          description: Ingrediente creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/ingredient/{id}:
    get:
      tags: [Ingredients]
      summary: Obtiene un ingrediente por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingrediente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Ingredients]
      summary: Actualiza un ingrediente
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientInput'
      responses:
        '200':
          description: Ingrediente actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Ingredients]
      summary: Elimina un ingrediente
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingrediente eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/category:
    get:
      tags: [Categories]
      summary: Lista categorías con paginación y filtro por nombre
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Categorías paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categories]
      summary: Crea una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/category/{id}:
    get:
      tags: [Categories]
      summary: Obtiene una categoría por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryWithProducts'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Categories]
      summary: Actualiza una categoría
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Categories]
      summary: Elimina una categoría
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Categoría eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/product:
    get:
      tags: [Products]
      summary: Lista productos con paginación y filtro por nombre
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Productos paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProductExpanded'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Products]
      summary: Crea un producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWithCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/product/category/{categoryId}:
    get:
      tags: [Products]
      summary: Lista productos por categoría
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Productos de la categoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductWithCategory'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/product/{id}:
    get:
      tags: [Products]
      summary: Obtiene un producto por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductById'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Products]
      summary: Actualiza un producto
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWithCategory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Products]
      summary: Elimina un producto
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/recipe:
    get:
      tags: [Recipes]
      summary: Lista recetas con paginación
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Recetas paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecipeExpanded'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Recipes]
      summary: Crea una receta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: Receta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeFull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/recipe/product/{productId}:
    get:
      tags: [Recipes]
      summary: Obtiene la receta asociada a un producto
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Receta del producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeWithIngredients'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/recipe/ingredients/{id}:
    get:
      tags: [Recipes]
      summary: Obtiene solo los ingredientes de una receta
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingredientes de la receta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreparationIngredient'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/recipe/{id}:
    get:
      tags: [Recipes]
      summary: Obtiene una receta por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Receta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeFull'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Recipes]
      summary: Reemplaza los ingredientes de una receta
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ingredientes:
                  type: array
                  items:
                    $ref: '#/components/schemas/PreparationIngredientInput'
              required: [ingredientes]
      responses:
        '200':
          description: Receta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeWithIngredients'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Recipes]
      summary: Elimina una receta
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Receta eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/state:
    get:
      tags: [States]
      summary: Lista estados con paginación y filtro por nombre
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Estados paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/State'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [States]
      summary: Crea un estado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateInput'
      responses:
        '201':
          description: Estado creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/state/{id}:
    get:
      tags: [States]
      summary: Obtiene un estado por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Estado encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [States]
      summary: Actualiza un estado
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateInput'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/State'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [States]
      summary: Elimina un estado
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Estado eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/order:
    get:
      tags: [Orders]
      summary: Lista órdenes con paginación
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Órdenes paginadas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderSummary'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      summary: Crea una orden y genera su historial inicial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateInput'
      responses:
        '201':
          description: Orden creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/order/client/{clientId}:
    get:
      tags: [Orders]
      summary: Lista órdenes de un cliente
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Órdenes del cliente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/order/state/{state}:
    get:
      tags: [Orders]
      summary: Lista órdenes por estado actual
      parameters:
        - name: state
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Órdenes filtradas por estado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrderSummary'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/order/{id}/history:
    get:
      tags: [Orders]
      summary: Obtiene el historial de estados de una orden
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Historial de estados de la orden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderStatusHistoryEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/order/{id}:
    get:
      tags: [Orders]
      summary: Obtiene una orden por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFull'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Orders]
      summary: Actualiza una orden y registra el cambio de estado si corresponde
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateInput'
      responses:
        '200':
          description: Orden actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFull'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Orders]
      summary: Elimina una orden
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Orden eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/line:
    post:
      tags: [Lines]
      summary: Crea una línea de orden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineCreateInput'
      responses:
        '201':
          description: Línea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineExpanded'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/line/order/{orderId}:
    get:
      tags: [Lines]
      summary: Lista líneas de una orden
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Líneas de la orden
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LineWithProduct'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/line/{id}:
    get:
      tags: [Lines]
      summary: Obtiene una línea por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Línea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineExpanded'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Lines]
      summary: Actualiza una línea
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineUpdateInput'
      responses:
        '200':
          description: Línea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineExpanded'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Lines]
      summary: Elimina una línea
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Línea eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/stockMovementType:
    get:
      tags: [Stock Movement Types]
      summary: Lista tipos de movimiento con paginación y filtro por nombre
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQ'
      responses:
        '200':
          description: Tipos de movimiento paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StockMovementType'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Stock Movement Types]
      summary: Crea un tipo de movimiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementTypeInput'
      responses:
        '201':
          description: Tipo de movimiento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/stockMovementType/{id}:
    get:
      tags: [Stock Movement Types]
      summary: Obtiene un tipo de movimiento por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tipo de movimiento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementType'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Stock Movement Types]
      summary: Actualiza un tipo de movimiento
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementTypeInput'
      responses:
        '200':
          description: Tipo de movimiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementType'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Stock Movement Types]
      summary: Elimina un tipo de movimiento
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Tipo de movimiento eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/stockMovement:
    get:
      tags: [Stock Movements]
      summary: Lista movimientos de stock con filtros opcionales
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: typeId
          in: query
          schema:
            type: integer
          description: Filtra por tipo de movimiento
        - name: ingredientId
          in: query
          schema:
            type: integer
          description: Filtra por movimientos que contengan el ingrediente indicado
        - name: productId
          in: query
          schema:
            type: integer
          description: Filtra por movimientos que contengan el producto indicado
      responses:
        '200':
          description: Movimientos de stock paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StockMovementFull'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Stock Movements]
      summary: Crea un movimiento de stock con sus detalles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementCreateInput'
      responses:
        '201':
          description: Movimiento de stock creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementFull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/stockMovement/{id}:
    get:
      tags: [Stock Movements]
      summary: Obtiene un movimiento de stock por ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Movimiento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementFull'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Stock Movements]
      summary: Actualiza un movimiento de stock y reemplaza sus detalles si se envían
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementUpdateInput'
      responses:
        '200':
          description: Movimiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementFull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Stock Movements]
      summary: Elimina un movimiento de stock
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Movimiento eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 10
    SearchQ:
      name: q
      in: query
      schema:
        type: string
      description: Texto de búsqueda por nombre
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer

  responses:
    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
      required: [total, page, pageSize, totalPages]

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'
      required: [data, meta]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    Client:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        whatsapp:
          type: integer
      required: [id, nombre, whatsapp]

    ClientCreateInput:
      type: object
      properties:
        nombre:
          type: string
        whatsapp:
          type: integer
      required: [nombre, whatsapp]

    Ingredient:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        unidad_medida:
          type: string
      required: [id, nombre, unidad_medida]

    IngredientInput:
      type: object
      properties:
        nombre:
          type: string
        unidad_medida:
          type: string
      required: [nombre, unidad_medida]

    Category:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required: [id, nombre]

    CategoryInput:
      type: object
      properties:
        nombre:
          type: string
      required: [nombre]

    CategoryWithProducts:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          properties:
            productos:
              type: array
              items:
                $ref: '#/components/schemas/Product'
          required: [productos]

    Product:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        precio:
          type: number
          format: float
        id_categoria:
          type: integer
      required: [id, nombre, precio, id_categoria]

    ProductInput:
      type: object
      properties:
        nombre:
          type: string
        id_categoria:
          type: integer
        precio:
          type: number
          format: float
      required: [nombre, id_categoria]

    ProductUpdateInput:
      type: object
      properties:
        nombre:
          type: string
        id_categoria:
          type: integer
        precio:
          type: number
          format: float

    ProductWithCategory:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            categoria:
              $ref: '#/components/schemas/Category'
          required: [categoria]

    ProductExpanded:
      allOf:
        - $ref: '#/components/schemas/ProductWithCategory'
        - type: object
          properties:
            preparacion:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RecipeWithIngredients'

    ProductById:
      allOf:
        - $ref: '#/components/schemas/ProductWithCategory'
        - type: object
          properties:
            lineas:
              type: array
              items:
                $ref: '#/components/schemas/Line'
            movimientos_stock_detalle_producto:
              type: array
              items:
                $ref: '#/components/schemas/StockMovementDetail'
            preparacion:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/RecipeWithIngredients'
          required: [lineas, movimientos_stock_detalle_producto]

    PreparationIngredient:
      type: object
      properties:
        id:
          type: integer
        id_preparacion:
          type: integer
        id_ingrediente:
          type: integer
        cantidad:
          type: number
          format: float
      required: [id, id_preparacion, id_ingrediente, cantidad]

    PreparationIngredientWithIngredient:
      allOf:
        - $ref: '#/components/schemas/PreparationIngredient'
        - type: object
          properties:
            ingrediente:
              $ref: '#/components/schemas/Ingredient'
          required: [ingrediente]

    PreparationIngredientInput:
      type: object
      properties:
        id_ingrediente:
          type: integer
        cantidad:
          type: number
          format: float
      required: [id_ingrediente, cantidad]

    Recipe:
      type: object
      properties:
        id:
          type: integer
        id_producto:
          type: integer
      required: [id, id_producto]

    RecipeInput:
      type: object
      properties:
        id_producto:
          type: integer
        ingredientes:
          type: array
          items:
            $ref: '#/components/schemas/PreparationIngredientInput'
      required: [id_producto, ingredientes]

    RecipeWithIngredients:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties:
            ingredientes:
              type: array
              items:
                $ref: '#/components/schemas/PreparationIngredientWithIngredient'
          required: [ingredientes]

    RecipeExpanded:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties:
            producto:
              type: object
              properties:
                id:
                  type: integer
                nombre:
                  type: string
              required: [id, nombre]
            ingredientes:
              type: array
              items:
                $ref: '#/components/schemas/PreparationIngredientWithIngredient'
          required: [producto, ingredientes]

    RecipeFull:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties:
            producto:
              $ref: '#/components/schemas/Product'
            ingredientes:
              type: array
              items:
                $ref: '#/components/schemas/PreparationIngredientWithIngredient'
          required: [producto, ingredientes]

    State:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        es_final:
          type: boolean
      required: [id, nombre, es_final]

    StateInput:
      type: object
      properties:
        nombre:
          type: string
        es_final:
          type: boolean
      required: [nombre]

    OrderBase:
      type: object
      properties:
        id:
          type: integer
        id_cliente:
          type: integer
        id_estado_actual:
          type: integer
        metodo_pago:
          type: string
        creacion:
          type: string
          format: date-time
        entrega_estimada:
          type: string
          format: date-time
        entrega_real:
          type: string
          format: date-time
          nullable: true
      required: [id, id_cliente, id_estado_actual, metodo_pago, creacion, entrega_estimada]

    OrderCreateInput:
      type: object
      properties:
        id_cliente:
          type: integer
        id_estado_actual:
          type: integer
        metodo_pago:
          type: string
        creacion:
          type: string
          format: date-time
        entrega_estimada:
          type: string
          format: date-time
        entrega_real:
          type: string
          format: date-time
          nullable: true
      required: [id_cliente, id_estado_actual, metodo_pago, entrega_estimada]

    OrderUpdateInput:
      type: object
      properties:
        id_cliente:
          type: integer
        id_estado_actual:
          type: integer
        metodo_pago:
          type: string
        creacion:
          type: string
          format: date-time
        entrega_estimada:
          type: string
          format: date-time
        entrega_real:
          type: string
          format: date-time
          nullable: true

    OrderSummary:
      type: object
      properties:
        id:
          type: integer
        metodo_pago:
          type: string
        creacion:
          type: string
          format: date-time
        entrega_estimada:
          type: string
          format: date-time
        entrega_real:
          type: string
          format: date-time
          nullable: true
        total:
          type: number
          format: float
        cliente:
          $ref: '#/components/schemas/Client'
        estado_actual:
          $ref: '#/components/schemas/State'
      required: [id, metodo_pago, creacion, entrega_estimada, total, cliente, estado_actual]

    OrderStatusHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        id_orden:
          type: integer
        id_estado:
          type: integer
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
          nullable: true
        estado:
          $ref: '#/components/schemas/State'
      required: [id, id_orden, id_estado, inicio, estado]

    OrderFull:
      allOf:
        - $ref: '#/components/schemas/OrderBase'
        - type: object
          properties:
            total:
              type: number
              format: float
            cliente:
              $ref: '#/components/schemas/Client'
            estado_actual:
              $ref: '#/components/schemas/State'
            lineas:
              type: array
              items:
                $ref: '#/components/schemas/LineWithProduct'
            historial_estados:
              type: array
              items:
                $ref: '#/components/schemas/OrderStatusHistoryEntry'
          required: [total, cliente, estado_actual, lineas, historial_estados]

    Line:
      type: object
      properties:
        id:
          type: integer
        id_orden:
          type: integer
        id_producto:
          type: integer
        cantidad:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        precio_unitario:
          type: number
          format: float
      required: [id, id_orden, id_producto, cantidad, subtotal, precio_unitario]

    LineCreateInput:
      type: object
      properties:
        id_orden:
          type: integer
        id_producto:
          type: integer
        cantidad:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        precio_unitario:
          type: number
          format: float
      required: [id_orden, id_producto, cantidad]

    LineUpdateInput:
      type: object
      properties:
        id_orden:
          type: integer
        id_producto:
          type: integer
        cantidad:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        precio_unitario:
          type: number
          format: float

    LineWithProduct:
      allOf:
        - $ref: '#/components/schemas/Line'
        - type: object
          properties:
            producto:
              $ref: '#/components/schemas/Product'
          required: [producto]

    LineExpanded:
      allOf:
        - $ref: '#/components/schemas/LineWithProduct'
        - type: object
          properties:
            orden:
              type: object
              properties:
                id:
                  type: integer
                id_cliente:
                  type: integer
                id_estado_actual:
                  type: integer
                metodo_pago:
                  type: string
                creacion:
                  type: string
                  format: date-time
                entrega_estimada:
                  type: string
                  format: date-time
                entrega_real:
                  type: string
                  format: date-time
                  nullable: true
                cliente:
                  $ref: '#/components/schemas/Client'
                estado_actual:
                  $ref: '#/components/schemas/State'
              required: [id, id_cliente, id_estado_actual, metodo_pago, creacion, entrega_estimada, cliente, estado_actual]
          required: [orden]

    StockMovementType:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
      required: [id, nombre]

    StockMovementTypeInput:
      type: object
      properties:
        nombre:
          type: string
      required: [nombre]

    StockMovementDetail:
      type: object
      properties:
        id:
          type: integer
        id_movimiento:
          type: integer
        id_ingrediente:
          type: integer
          nullable: true
        id_producto:
          type: integer
          nullable: true
        cantidad:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        precio_unitario:
          type: number
          format: float
      required: [id, id_movimiento, cantidad, subtotal, precio_unitario]

    StockMovementDetailExpanded:
      allOf:
        - $ref: '#/components/schemas/StockMovementDetail'
        - type: object
          properties:
            ingrediente:
              allOf:
                - $ref: '#/components/schemas/Ingredient'
              nullable: true
            producto:
              allOf:
                - $ref: '#/components/schemas/Product'
              nullable: true

    StockMovementDetailInput:
      type: object
      properties:
        id_ingrediente:
          type: integer
          nullable: true
        id_producto:
          type: integer
          nullable: true
        cantidad:
          type: number
          format: float
        subtotal:
          type: number
          format: float
        precio_unitario:
          type: number
          format: float
      required: [cantidad, subtotal, precio_unitario]

    StockMovementBase:
      type: object
      properties:
        id:
          type: integer
        id_tipo_movimiento:
          type: integer
        fecha:
          type: string
          format: date-time
        detalle:
          type: string
          nullable: true
      required: [id, id_tipo_movimiento, fecha]

    StockMovementCreateInput:
      type: object
      properties:
        id_tipo_movimiento:
          type: integer
        fecha:
          type: string
          format: date-time
        detalle:
          type: string
          nullable: true
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementDetailInput'
      required: [id_tipo_movimiento, detalles]

    StockMovementUpdateInput:
      type: object
      properties:
        id_tipo_movimiento:
          type: integer
        fecha:
          type: string
          format: date-time
        detalle:
          type: string
          nullable: true
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/StockMovementDetailInput'

    StockMovementFull:
      allOf:
        - $ref: '#/components/schemas/StockMovementBase'
        - type: object
          properties:
            tipo_movimiento:
              $ref: '#/components/schemas/StockMovementType'
            detalles:
              type: array
              items:
                $ref: '#/components/schemas/StockMovementDetailExpanded'
          required: [tipo_movimiento, detalles]
